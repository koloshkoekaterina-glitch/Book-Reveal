<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Book Reveal Scratch Card</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        overflow: hidden;
        position: relative;
        /* Глибокий океанський базовий колір */
        background: #021428;
      }

      /* Контейнер для реалістичного морського фону */
      .ocean {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }

      /* Шар повільних переливчастих хвиль */
      .water-layer {
        position: absolute;
        top: -50%;
        left: -50%;
        right: -50%;
        bottom: -50%;
        width: 200%;
        height: 200%;
        background: 
          /* Сонячні відблиски на поверхні */
          radial-gradient(ellipse at 30% 20%, rgba(255, 220, 130, 0.25) 0%, transparent 40%),
          radial-gradient(ellipse at 70% 60%, rgba(100, 210, 255, 0.2) 0%, transparent 50%),
          /* Хвилясті переливи води */
          linear-gradient(120deg, #021428 0%, #0a3d62 30%, #1e5f74 50%, #0c2d48 70%, #021428 100%);
        background-size: 100% 100%, 100% 100%, 200% 200%;
        animation: waveMotion 25s ease-in-out infinite alternate;
        z-index: 1;
      }

      /* Додатковий шар для ефекту мерехтіння сонця */
      .sun-glimmer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.3) 0%, rgba(255, 230, 150, 0.1) 30%, transparent 70%);
        opacity: 0.5;
        mix-blend-mode: overlay;
        animation: sunShimmer 6s ease-in-out infinite alternate;
        z-index: 2;
      }

      /* Плавний рух хвиль */
      @keyframes waveMotion {
        0% {
          transform: translate(0, 0) scale(1) rotate(0deg);
        }
        50% {
          transform: translate(-3%, -2%) scale(1.05) rotate(1deg);
        }
        100% {
          transform: translate(3%, 3%) scale(1) rotate(-1deg);
        }
      }

      /* Мерехтіння від сонця */
      @keyframes sunShimmer {
        0% {
          opacity: 0.3;
          transform: scale(0.98) translateY(0);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.02) translateY(-10px);
        }
        100% {
          opacity: 0.4;
          transform: scale(1) translateY(5px);
        }
      }

      /* Основна картка */
      .scratch-container {
        position: relative;
        width: 600px;
        max-width: 90%;
        user-select: none;
        z-index: 10;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        border-radius: 8px;
        overflow: hidden;
      }

      /* UNDERNEATH: The Book Cover Image */
      .reveal-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        display: block;
        z-index: 1;
      }

      /* ON TOP: The Scratched Envelope Canvas */
      canvas {
        position: relative;
        z-index: 2;
        cursor: crosshair;
        touch-action: none;
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>

    <!-- Живий морський фон із сонячним мерехтінням -->
    <div class="ocean">
      <div class="water-layer"></div>
      <div class="sun-glimmer"></div>
    </div>

    <!-- Основна картка зі стиранням -->
    <div class="scratch-container">
      <!-- 1. Book Cover sits underneath -->
      <img class="reveal-image" src="photo_2026-10-10_15-57-57.jpg" alt="Book Cover">
      
      <!-- 2. Envelope sits on top as the scratch layer -->
      <canvas id="scratchCanvas"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('scratchCanvas');
      const ctx = canvas.getContext('2d');

      const fgImage = new Image();
      fgImage.src = 'photo_2026-10-09_20-27-38.jpg'; // The envelope image on top

      fgImage.onload = function() {
        canvas.width = fgImage.naturalWidth;
        canvas.height = fgImage.naturalHeight;
        ctx.drawImage(fgImage, 0, 0);
      };

      let isDrawing = false;

      function getPosition(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        let clientX = e.clientX;
        let clientY = e.clientY;

        if (e.touches && e.touches[0]) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        }

        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function scratch(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPosition(e);

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 90, 0, Math.PI * 2, false); // Brush size set to 90
        ctx.fill();
      }

      // Mouse Events
      canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
      canvas.addEventListener('mousemove', scratch);
      window.addEventListener('mouseup', () => { isDrawing = false; });

      // Touch Events for phones/tablets/stylus pens
      canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, { passive: false });
      canvas.addEventListener('touchmove', scratch, { passive: false });
      window.addEventListener('touchend', () => { isDrawing = false; });
    </script>

  </body>
</html>
