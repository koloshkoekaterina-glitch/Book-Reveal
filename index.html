<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Book Reveal Scratch Card</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        overflow: hidden;
        position: relative;
        background: #000;
      }

      /* Фонове відео з реальним морем */
      .ocean-video-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }

      .ocean-video-container video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        filter: brightness(0.85) contrast(1.1); /* Налаштування кольору під гаму вашого фото */
      }

      /* Легкий шар для сонячного мерехтіння поверх відео */
      .shimmer-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.25) 0%, transparent 70%);
        opacity: 0.6;
        mix-blend-mode: overlay;
        animation: sunGlimmer 5s ease-in-out infinite alternate;
        z-index: 1;
        pointer-events: none;
      }

      @keyframes sunGlimmer {
        0% { opacity: 0.4; transform: scale(1); }
        100% { opacity: 0.8; transform: scale(1.03); }
      }

      /* Основна картка */
      .scratch-container {
        position: relative;
        width: 600px;
        max-width: 90%;
        user-select: none;
        z-index: 10;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
        border-radius: 8px;
        overflow: hidden;
      }

      /* UNDERNEATH: The Book Cover Image */
      .reveal-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        display: block;
        z-index: 1;
      }

      /* ON TOP: The Scratched Envelope Canvas */
      canvas {
        position: relative;
        z-index: 2;
        cursor: crosshair;
        touch-action: none;
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>

    <!-- Живе фонове відео реального моря -->
    <div class="ocean-video-container">
      <video autoplay muted loop playsinline>
        <!-- Ви можете змінити посилання на будь-яке інше відео з вільних фотостоків або завантажити своє -->
        <source src="https://assets.mixkit.co/videos/preview/mixkit-sea-waves-in-the-sun-41520-large.mp4" type="video/mp4">
      </video>
      <div class="shimmer-overlay"></div>
    </div>

    <!-- Основна картка зі стиранням -->
    <div class="scratch-container">
      <!-- 1. Book Cover sits underneath -->
      <img class="reveal-image" src="photo_2026-10-10_15-57-57.jpg" alt="Book Cover">
      
      <!-- 2. Envelope sits on top as the scratch layer -->
      <canvas id="scratchCanvas"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('scratchCanvas');
      const ctx = canvas.getContext('2d');

      const fgImage = new Image();
      fgImage.src = 'photo_2026-10-09_20-27-38.jpg'; // The envelope image on top

      fgImage.onload = function() {
        canvas.width = fgImage.naturalWidth;
        canvas.height = fgImage.naturalHeight;
        ctx.drawImage(fgImage, 0, 0);
      };

      let isDrawing = false;

      function getPosition(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        let clientX = e.clientX;
        let clientY = e.clientY;

        if (e.touches && e.touches[0]) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        }

        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function scratch(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPosition(e);

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 90, 0, Math.PI * 2, false); // Brush size set to 90
        ctx.fill();
      }

      // Mouse Events
      canvas.addEventListener('mousedown', (e) => { isDrawing = andTrue = true; isDrawing = true; scratch(e); });
      canvas.addEventListener('mousemove', scratch);
      window.addEventListener('mouseup', () => { isDrawing = false; });

      // Touch Events for phones/tablets/stylus pens
      canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, { passive: false });
      canvas.addEventListener('touchmove', scratch, { passive: false });
      window.addEventListener('touchend', () => { isDrawing = false; });
    </script>

  </body>
</html>
