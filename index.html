<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Book Reveal Scratch Card</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
      }
      .scratch-container {
        position: relative;
        width: 600px;
        max-width: 100%;
        user-select: none;
      }
      /* The revealed image sits underneath */
      .reveal-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        display: block;
        z-index: 1;
      }
      /* The canvas sits on top and acts as the scratch layer */
      canvas {
        position: relative;
        z-index: 2;
        cursor: crosshair;
        touch-action: none;
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>

    <div class="scratch-container">
      <!-- The Book Cover (Revealed underneath) -->
      <img class="reveal-image" src="photo_2026-10-10_15-57-57.jpg" alt="Book Cover">[cite: 3]
      
      <!-- Canvas for The Scratched Envelope -->
      <canvas id="scratchCanvas"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('scratchCanvas');
      const ctx = canvas.getContext('2d');

      const fgImage = new Image();
      fgImage.src = 'photo_2026-10-09_20-27-38.jpg';[cite: 2]

      fgImage.onload = function() {
        canvas.width = fgImage.naturalWidth;
        canvas.height = fgImage.naturalHeight;
        ctx.drawImage(fgImage, 0, 0);
      };

      let isDrawing = false;

      function getPosition(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        let clientX = e.clientX;
        let clientY = e.clientY;

        if (e.touches && e.touches[0]) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        }

        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function scratch(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPosition(e);

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 90, 0, Math.PI * 2, false);
        ctx.fill();
      }

      // Mouse Events
      canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
      canvas.addEventListener('mousemove', scratch);
      window.addEventListener('mouseup', () => { isDrawing = false; });

      // Touch Events for phones/tablets/stylus pens
      canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, { passive: false });
      canvas.addEventListener('touchmove', scratch, { passive: false });
      window.addEventListener('touchend', () => { isDrawing = false; });
    </script>

  </body>
</html>
